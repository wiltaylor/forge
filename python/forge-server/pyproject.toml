[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-server"
version = "0.1.0"
description = "Lightweight Python backend for Forge hack tools (frozen Forge API contract v1)"
readme = "README.md"
requires-python = ">=3.11"
# Floors track what uv.lock actually resolves and what the test suite runs
# against, rather than the oldest version that once worked.
dependencies = [
    # The core runs sync actions on anyio's threadpool — the one the web
    # framework uses — so it is a direct dependency, not a transitive one.
    "anyio>=4",
    "fastapi>=0.140",
    "uvicorn>=0.51",
    "websockets>=16",
    "pyjwt>=2.13",
    "sse-starlette>=3.4",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
argon2 = ["argon2-cffi>=25"]
dev = [
    "pytest>=9",
    "httpx>=0.28",
    "pytest-asyncio>=1.4",
    "argon2-cffi>=25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forge_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
