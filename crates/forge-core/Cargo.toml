[package]
name = "forge-core"
description = "Transport-agnostic core of the Forge backend: doc store, actions, events, claims, envelope shapes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Interactive remote-access widget engines (see docs/widgets-protocol.md).
# Not part of the frozen v1.0 API contract; the terminal engine exposes a
# real shell, so these are opt-in at compile time AND at runtime (transport
# builders gate them again).
term = ["dep:portable-pty", "tokio/time"]
term-ssh = ["term", "dep:russh"]
vnc = ["dep:vnc-rs", "dep:flate2", "dep:jpeg-encoder", "tokio/net", "tokio/time"]
rdp = ["dep:ironrdp", "dep:ironrdp-tokio", "dep:ironrdp-tls", "dep:flate2", "dep:jpeg-encoder", "tokio/net", "tokio/time"]
widgets = ["term", "term-ssh", "vnc", "rdp"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "macros", "rt"] }
tracing = "0.1"
# Widget backends — all optional, behind the cargo features above.
portable-pty = { version = "0.9", optional = true }
# russh and ironrdp are pinned together: `widgets` enables term-ssh and rdp at
# once, so they must share one RustCrypto/dalek graph, and ironrdp's picky
# tracks prereleases that no russh release matches.
#
#   ironrdp 0.16 -> picky 7.0.0-rc.23 -> ed25519-dalek 3.0.0-pre.6, whose
#   `ed25519` requirement is itself a prerelease range — so the tree resolves on
#   ed25519 3.0.0-rc.4 / pkcs8 0.11.0-rc.11 / pkcs5 0.8.0-rc.13, which is what
#   russh 0.60 is built against.
#
# Moving either end breaks it:
#   - ironrdp 0.17 -> picky 7.0.0-rc.25 -> ed25519-dalek 3.0.0-rc.1, which asks
#     for a stable `ed25519 ^3`. That pulls pkcs5 0.8.0, whose pbes2::Parameters
#     dropped `pbkdf2_sha256_aes256cbc` — russh 0.60 no longer compiles.
#   - russh 0.62 (built for the stable chain) + ironrdp 0.17 is a hard resolver
#     conflict on `ecdsa`, and on curve25519-dalek (picky pins =5.0.0-rc.1,
#     russh 0.62 wants the 5.0.0 release).
#
# Revisit when picky 7.0 ships stable; then both should move together.
russh = { version = "0.60", optional = true }
vnc-rs = { version = "0.5", optional = true }
ironrdp = { version = "0.16", features = ["connector", "session", "graphics", "input", "pdu"], optional = true }
ironrdp-tokio = { version = "0.9", optional = true }
ironrdp-tls = { version = "0.2", features = ["rustls"], optional = true }
# Per-rect wire compression for the desktop widgets (vnc/rdp features).
flate2 = { version = "1", optional = true }
jpeg-encoder = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3"
# `tokio::io::duplex` for the widget session tests.
tokio = { version = "1", features = ["io-util"] }
# Decode-side verification of the deflate/JPEG rect encodings.
flate2 = "1"
zune-jpeg = "0.5"
