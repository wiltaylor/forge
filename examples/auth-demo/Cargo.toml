[package]
name = "auth-demo"
description = "Minimal forge relying party: logs in via forge-auth (OIDC code + PKCE)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
forge-server = { workspace = true }
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
# Held at 0.12 to match forge-auth, which oauth2/openidconnect pin there —
# bumping only this example would compile a second reqwest major for no gain.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
# Held at 0.10 / 0.8 to match forge-auth's crypto stack — see its Cargo.toml.
sha2 = "0.10"
base64 = "0.23"
rand = "0.8"
